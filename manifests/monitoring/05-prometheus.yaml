apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: prometheus
      securityContext:
        # NOTE: runAsNonRoot is deliberately NOT set at pod level: the init
        # container has to run as root once to chown the NFS-backed volume.
        # The Prometheus container itself is pinned to UID 65534 below.
        runAsUser: 65534
        fsGroup: 65534
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 65534:65534 /prometheus && chmod 0777 /prometheus"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - {name: data, mountPath: /prometheus}
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v2.54.1
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --storage.tsdb.retention.size=4GB
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles
        - --web.enable-lifecycle
        - --web.enable-admin-api
        ports:
        - name: http
          containerPort: 9090
        readinessProbe:
          httpGet: {path: /-/ready, port: 9090}
          initialDelaySeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /-/healthy, port: 9090}
          initialDelaySeconds: 30
          timeoutSeconds: 5
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: "1", memory: 1500Mi}
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus}
        - {name: rules, mountPath: /etc/prometheus/rules}
        - {name: data, mountPath: /prometheus}
      volumes:
      - name: config
        configMap:
          name: prometheus-config
          items:
          - {key: prometheus.yml, path: prometheus.yml}
      - name: rules
        configMap:
          name: prometheus-config
          items:
          - {key: kubernetes-alerts.yaml, path: kubernetes-alerts.yaml}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: nfs-dynamic
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    nodePort: 30090
