# =============================================================================
#  ⚠️  PLACEHOLDER CREDENTIAL - READ BEFORE USING THIS REPOSITORY FOR ANYTHING
# =============================================================================
#  This file ships with a PLACEHOLDER password, not a real one. The value the
#  author actually used in the lab lives in an untracked file on the author's
#  workstation and is deliberately NOT in this repository.
#
#  Why keep the Secret in git at all?  So that a clone is still reproducible in
#  one `kubectl apply -k`, with a value that is obviously a placeholder and
#  obviously not reused anywhere.
#
#  How to set a real password (pick one, in ascending order of effort):
#    1. edit the value below before applying - fine for a NAT-only lab:
#         admin-password: "<your-password>"
#    2. create the secret out-of-band and delete this file from your fork:
#         kubectl -n monitoring create secret generic grafana-admin \
#           --from-literal=admin-user=admin \
#           --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD"
#    3. Sealed Secrets  - encrypt the value so it CAN live in git safely
#    4. External Secrets Operator + Vault / AWS Secrets Manager / etc.
#
#  Note: because `kubectl apply` does a three-way merge, re-applying a file whose
#  value changed WILL overwrite the live password. install-monitoring.sh therefore
#  creates this secret only when it does not already exist, so routine re-runs
#  never churn the credential. Rotating is a deliberate, separate action.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: credentials
  annotations:
    lab.example.com/purpose: "PLACEHOLDER - replace before any non-lab use"
type: Opaque
stringData:
  admin-user: admin
  admin-password: "change-me-before-exposing-grafana"
