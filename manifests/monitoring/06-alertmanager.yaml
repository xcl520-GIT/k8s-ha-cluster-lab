apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # ------------------------------------------------------------------
    # Routing tree. Everything lands on the built-in "default" receiver
    # for this lab. In production you would attach email / webhook /
    # DingTalk / Slack receivers here and split by team + severity.
    # ------------------------------------------------------------------
    route:
      receiver: default
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
      - matchers:
        - severity = "critical"
        receiver: default
        continue: false
      - matchers:
        - severity = "warning"
        receiver: default
        continue: false

    # A firing critical alert mutes the matching warning for the same
    # alertname+namespace, so you are not paged twice for one incident.
    inhibit_rules:
    - source_matchers: [severity = "critical"]
      target_matchers: [severity = "warning"]
      equal: [alertname, namespace]

    receivers:
    - name: default
      # No notifier configured on purpose: alerts are visible in the
      # Alertmanager UI. Add slack_configs / webhook_configs here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: alertmanager
        image: quay.io/prometheus/alertmanager:v0.27.0
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - name: http
          containerPort: 9093
        readinessProbe:
          httpGet: {path: /-/ready, port: 9093}
          initialDelaySeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /-/healthy, port: 9093}
          initialDelaySeconds: 20
          timeoutSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - {name: config, mountPath: /etc/alertmanager}
        - {name: storage, mountPath: /alertmanager}
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
  - name: http
    port: 9093
    targetPort: 9093
    nodePort: 30093
