apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.monitoring.svc.cluster.local:9090
      isDefault: true
      jsonData:
        timeInterval: 15s
        httpMethod: POST
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
    - name: k8s-lab
      orgId: 1
      folder: "K8s Lab"
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
        foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  k8s-lab-overview.json: |
    {
      "uid": "k8s-lab-overview",
      "title": "K8s Lab - Cluster Overview",
      "tags": ["k8s", "lab", "sre"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "annotations": {"list": []},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Nodes Ready",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 1)", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "background", "graphMode": "none", "textMode": "auto"},
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 3}]}}, "overrides": []}
        },
        {
          "id": 2, "type": "stat", "title": "Pods Running",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "targets": [{"refId": "A", "expr": "count(kube_pod_status_phase{phase=\"Running\"} == 1)", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 3, "type": "stat", "title": "Firing Alerts",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(ALERTS{alertstate=\"firing\"}) or vector(0)", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "background", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 3}]}}, "overrides": []}
        },
        {
          "id": 4, "type": "stat", "title": "Cluster CPU (cores in use)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",pod!=\"\"}[5m]))", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 2}, "overrides": []}
        },
        {
          "id": 5, "type": "timeseries", "title": "Node CPU usage %",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "targets": [{"refId": "A", "expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[$__rate_interval])) * 100)", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "custom": {"fillOpacity": 10, "lineWidth": 2}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 6, "type": "timeseries", "title": "Node memory usage %",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "targets": [{"refId": "A", "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "custom": {"fillOpacity": 10, "lineWidth": 2}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}}
        },
        {
          "id": 7, "type": "timeseries", "title": "Top 10 pods by CPU (cores)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\",pod!=\"\"}[5m])))", "legendFormat": "{{namespace}}/{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 3}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}}
        },
        {
          "id": 8, "type": "timeseries", "title": "Top 10 pods by memory (MiB)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\",pod!=\"\"}))", "legendFormat": "{{namespace}}/{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"fillOpacity": 10}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}}
        },
        {
          "id": 9, "type": "timeseries", "title": "Node filesystem used % (non-tmpfs)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21},
          "targets": [{"refId": "A", "expr": "(1 - (node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs\"})) * 100", "legendFormat": "{{node}} {{mountpoint}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}}
        },
        {
          "id": 10, "type": "timeseries", "title": "Node network throughput (bytes/s)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21},
          "targets": [
            {"refId": "A", "expr": "sum by (node) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*\"}[$__rate_interval]))", "legendFormat": "{{node}} rx"},
            {"refId": "B", "expr": "-sum by (node) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*\"}[$__rate_interval]))", "legendFormat": "{{node}} tx"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}}
        }
      ]
    }
  k8s-lab-custom-exporter.json: |
    {
      "uid": "k8s-lab-custom-exporter",
      "title": "K8s Lab - Custom Exporter (P5)",
      "tags": ["k8s", "lab", "exporter", "sre"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "annotations": {"list": []},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "etcd backup age (hours)",
          "description": "lab_etcd_backup_age_seconds / 3600 - the single most important number on this dashboard. If it climbs past 24h the cluster has no fresh restore point.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "lab_etcd_backup_age_seconds / 3600", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "background", "graphMode": "area"},
          "fieldConfig": {"defaults": {"unit": "h", "decimals": 2, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 12}, {"color": "red", "value": 24}]}}, "overrides": []}
        },
        {
          "id": 2, "type": "stat", "title": "Soonest certificate expiry (days)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "targets": [{"refId": "A", "expr": "min(lab_certificate_expiry_days)", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "background", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "d", "decimals": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 30}, {"color": "green", "value": 90}]}}, "overrides": []}
        },
        {
          "id": 3, "type": "stat", "title": "Cluster healthy (own metric)",
          "description": "1 = no stuck pod and no deployment short of replicas.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "lab_cluster_healthy", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "background", "graphMode": "none"},
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 4, "type": "stat", "title": "Exporter scrape duration (s)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "targets": [{"refId": "A", "expr": "lab_exporter_scrape_duration_seconds", "instant": true}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"},
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 3}, "overrides": []}
        },
        {
          "id": 5, "type": "timeseries", "title": "Certificate expiry (days) per certificate",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "targets": [{"refId": "A", "expr": "lab_certificate_expiry_days", "legendFormat": "{{path}}"}],
          "fieldConfig": {"defaults": {"unit": "d", "custom": {"lineWidth": 2, "fillOpacity": 0}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["min", "last"]}}
        },
        {
          "id": 6, "type": "timeseries", "title": "etcd backup age (hours) over time",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "targets": [{"refId": "A", "expr": "lab_etcd_backup_age_seconds / 3600", "legendFormat": "age"}],
          "fieldConfig": {"defaults": {"unit": "h", "custom": {"fillOpacity": 10, "lineWidth": 2, "thresholdsStyle": {"mode": "line"}}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 24}]}}, "overrides": []}
        },
        {
          "id": 7, "type": "table", "title": "PDB allowed disruptions (0 == a drain would be refused)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "targets": [{"refId": "A", "expr": "lab_pdb_allowed_disruptions", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true}, "renameByName": {"namespace": "namespace", "pdb": "pdb", "Value": "allowed"}}}],
          "fieldConfig": {"defaults": {}, "overrides": [{"matcher": {"id": "byName", "options": "allowed"}, "properties": [{"id": "custom.cellOptions", "value": {"type": "color-background"}}, {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}]}]}
        },
        {
          "id": 8, "type": "timeseries", "title": "Stuck pods and replica mismatches (own metrics)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "targets": [
            {"refId": "A", "expr": "lab_cluster_pods_not_running", "legendFormat": "pods not running"},
            {"refId": "B", "expr": "lab_deployments_replicas_mismatch_total", "legendFormat": "replica mismatches"},
            {"refId": "C", "expr": "lab_cluster_container_restarts_total", "legendFormat": "container restarts"}
          ],
          "fieldConfig": {"defaults": {"custom": {"fillOpacity": 10, "lineWidth": 2}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["last", "max"]}}
        }
      ]
    }

  k8s-lab-node-detail.json: |
    {
      "uid": "k8s-lab-node-detail",
      "title": "K8s Lab - Node Detail",
      "tags": ["k8s", "lab", "node"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "annotations": {"list": []},
      "templating": {
        "list": [
          {
            "name": "node", "label": "Node", "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(node_uname_info, nodename)",
            "refresh": 1, "includeAll": false, "multi": false,
            "current": {"selected": true, "text": "k8s-node01", "value": "k8s-node01"},
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "CPU by mode ($node)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "sum by (mode) (rate(node_cpu_seconds_total{nodename=~\"$node\",mode!=\"idle\"}[$__rate_interval]))", "legendFormat": "{{mode}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 40, "stacking": {"mode": "normal"}}}, "overrides": []}
        },
        {
          "id": 2, "type": "timeseries", "title": "Memory breakdown ($node)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {"refId": "A", "expr": "node_memory_MemTotal_bytes{nodename=~\"$node\"}", "legendFormat": "total"},
            {"refId": "B", "expr": "node_memory_MemAvailable_bytes{nodename=~\"$node\"}", "legendFormat": "available"},
            {"refId": "C", "expr": "node_memory_Cached_bytes{nodename=~\"$node\"}", "legendFormat": "cached"},
            {"refId": "D", "expr": "node_memory_MemFree_bytes{nodename=~\"$node\"}", "legendFormat": "free"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 3, "type": "timeseries", "title": "Load average ($node)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "targets": [
            {"refId": "A", "expr": "node_load1{nodename=~\"$node\"}", "legendFormat": "load1"},
            {"refId": "B", "expr": "node_load5{nodename=~\"$node\"}", "legendFormat": "load5"},
            {"refId": "C", "expr": "node_load15{nodename=~\"$node\"}", "legendFormat": "load15"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 4, "type": "timeseries", "title": "Filesystem usage ($node)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "targets": [{"refId": "A", "expr": "node_filesystem_avail_bytes{nodename=~\"$node\",fstype!~\"tmpfs|overlay|squashfs|ramfs\"}", "legendFormat": "{{mountpoint}} free"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 5, "type": "timeseries", "title": "Network rx/tx ($node)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "targets": [
            {"refId": "A", "expr": "sum(rate(node_network_receive_bytes_total{nodename=~\"$node\",device!~\"lo|veth.*|cali.*\"}[$__rate_interval]))", "legendFormat": "rx"},
            {"refId": "B", "expr": "-sum(rate(node_network_transmit_bytes_total{nodename=~\"$node\",device!~\"lo|veth.*|cali.*\"}[$__rate_interval]))", "legendFormat": "tx"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
        }
      ]
    }
