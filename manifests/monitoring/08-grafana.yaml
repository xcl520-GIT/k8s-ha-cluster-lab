# The grafana-admin Secret lives in 08a-grafana-secret.yaml, deliberately in its
# own file so it is obvious which object has to be replaced before any real use.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-dynamic
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0
        imagePullPolicy: IfNotPresent
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef: {name: grafana-admin, key: admin-user}
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef: {name: grafana-admin, key: admin-password}
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
          value: "false"
        - name: GF_NEWS_NEWS_FEED_ENABLED
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: ""
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          httpGet: {path: /api/health, port: 3000}
          initialDelaySeconds: 20
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /api/health, port: 3000}
          initialDelaySeconds: 40
          timeoutSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 768Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/grafana}
        - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
        - {name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30300
